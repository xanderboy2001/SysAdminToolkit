name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Show PowerShell version
        run: $PSVersionTable

      # RequiredModules = ActiveDirectory, so the module cannot be imported without RSAT AD PowerShell.
      # Verify this step on the current runner image; adjust if the feature name or availability changes.
      - name: Install RSAT Active Directory PowerShell
        run: Install-WindowsFeature -Name RSAT-AD-PowerShell -ErrorAction Stop

      - name: Install test tooling
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Validate manifest
        run: Test-ModuleManifest -Path ./SysAdminToolkit.psd1 -ErrorAction Stop | Format-List Name, Version, ExportedFunctions

      - name: Analyzer + Pester (via report script)
        run: ./Tools/Export-TestReport.ps1 -IncludeIntegration

      - name: Fail on any analyzer finding
        run: |
          $findings = @(Import-Csv ./ScriptAnalyzer.csv)
          if ($findings.Count -gt 0) {
            $findings | Format-Table -AutoSize
            throw "$($findings.Count) analyzer finding(s)."
          }

      - name: Formatting check
        run: |
          $unformatted = foreach ($file in Get-ChildItem -Include *.ps1, *.psm1, *.psd1 -Recurse -File) {
            $text = Get-Content -LiteralPath $file.FullName -Raw
            $formatted = Invoke-Formatter -ScriptDefinition $text -Settings ./PSScriptAnalyzerSettings.psd1
            if ($formatted -cne $text) { $file.FullName }
          }
          if ($unformatted) { $unformatted; throw 'Run Invoke-Formatter on the files above.' }

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            TestReport.md
            ScriptAnalyzer.csv
